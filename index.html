<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GirlMentor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet"
  />

<style>
    :root {
      --pink-50: #fff5fa;
      --pink-100: #ffe4f1;
      --pink-200: #fbcfe8;
      --pink-300: #f9a8d4;
      --pink-400: #f472b6;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --pink-700: #be185d;
      --purple-300: #d8b4fe;
      --purple-400: #c084fc;
      --purple-500: #a855f7;
      --ink: #4c0519;
      --text: #5b5b6b;
    }

 html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 114, 182, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(192, 132, 252, 0.20), transparent 32%),
        radial-gradient(circle at center, rgba(255, 255, 255, 0.9), transparent 100%),
        #fff7fb;
      min-height: 100vh;
    }

 h1,
    h2,
    h3,
    h4 {
      font-family: "Playfair Display", serif;
      color: var(--pink-700);
      margin: 0;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hidden {
      display: none;
    }

.card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(244, 114, 182, 0.22);
      border-radius: 34px;
      padding: 34px;
      width: 100%;
      max-width: 1150px;
      box-shadow: 0 24px 80px rgba(236, 72, 153, 0.12);
    }

    
    .center {
      text-align: center;
    }

.badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 228, 241, 0.82);
      color: var(--pink-700);
      border: 1px solid rgba(244, 114, 182, 0.35);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.03em;
    }  
    
 .badge-green {
      background: rgba(209, 250, 229, 0.82);
      color: #065f46;
      border-color: rgba(16, 185, 129, 0.18);
    }

    .badge-blue {
      background: rgba(224, 242, 254, 0.82);
      color: #075985;
      border-color: rgba(14, 165, 233, 0.18);
    }
